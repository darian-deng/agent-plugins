name: Build ai-flow dist

on:
  push:
    branches: [main]
    paths:
      - 'plugins/ai-flow/src/**'
      - 'plugins/ai-flow/.ai-flow/**'
      - 'plugins/ai-flow/.claude-plugin/**'
      - 'plugins/ai-flow/package.json'
      - 'plugins/ai-flow/tsconfig*.json'
      - 'plugins/ai-flow/package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plugins/ai-flow/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: plugins/ai-flow

      - name: Build
        run: npm run build
        working-directory: plugins/ai-flow

      - name: Commit dist and sync marketplace version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read version from plugin.json (developer sets this, CI does not auto-increment)
          VERSION=$(node -p "require('./plugins/ai-flow/.claude-plugin/plugin.json').version")

          # Sync the same version into marketplace.json (developer only edits metadata there, not version)
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json','utf8'));
            const e=m.plugins.find(p=>p.name==='ai-flow');
            if(e) e.version='$VERSION';
            fs.writeFileSync('.claude-plugin/marketplace.json',JSON.stringify(m,null,2)+'\n');
          "

          git add plugins/ai-flow/dist/ --force
          git add .claude-plugin/marketplace.json

          if git diff --cached --quiet; then
            echo "dist/ unchanged, skipping commit"
          else
            git commit -m "build(ai-flow): compile dist/ [auto]"
            git push
          fi
